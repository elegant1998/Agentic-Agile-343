# 约束定义（结构化 YAML）
# 由 Constraint_Matrix.md 生成，Harness 引擎直接读取执行
# 版本: 1.5 — 增加 owner + evidence 字段；增加 escalate 执行等级
#
# ═══════════════════════════════════════════════════════════
# 约束最小字段（每条约束应覆盖以下 8 个维度）
# ═══════════════════════════════════════════════════════════
#
# | 字段        | YAML 键       | 说明                                   |
# |-------------|---------------|----------------------------------------|
# | ID          | id            | 稳定编号，便于证据引用                  |
# | Category    | domain        | 业务/安全/架构/数据/工具/质量/预算/流程  |
# | Rule        | description   | 必须、禁止或限制什么                    |
# | Scope       | watch_paths   | 对哪些文件、数据、环境或动作生效        |
# | Check       | check         | 如何检查（shell 命令或 nfr:xxx）        |
# | Enforcement | on_failure    | 见下方四级说明                          |
# | Owner       | owner         | 谁能解释规则或批准例外（IO/OA/Tech Lead）|
# | Evidence    | evidence      | 通过后保留什么证据（日志/截图/测试输出） |
#
# ═══════════════════════════════════════════════════════════
# Enforcement 四级执行策略（on_failure）
# ═══════════════════════════════════════════════════════════
#
# | 等级       | 行为                               | 适用场景                         |
# |------------|------------------------------------|----------------------------------|
# | warn       | 记录风险，允许继续                  | SHOULD 约束失败，风险可控         |
# | block      | 当前变更不能进入下一阶段            | MUST 约束失败，硬性阻断            |
# | escalate   | 系统无法自行决定，暂停并提交 IO/OA  | 人工判断类约束、歧义规则、影响范围不明 |
# | log        | 仅记录，不告警                     | MAY 约束失败，信息性记录           |
#
# 其中 owner 和 evidence 为 v1.5 新增字段，harness 引擎忽略但不报错；
# audit_evidence.py 可读取 evidence 字段自动校验证据包覆盖度。
# escalate 为 v1.5 新增等级，harness.py 输出 ESCALATE 状态并要求人工裁决。

project: YOUR_PROJECT_NAME
version: "1.4"

# ═══════════════════════════════════════════════════════════
# 域分层说明
# ═══════════════════════════════════════════════════════════
#
# 核心六域（所有项目必须）:
#   STRUCT / DATA / BEHAVE / QUAL / PROC / STYLE
#   → 适用于任何项目类型（Web / CLI / Lib）
#   → STYLE 是新增域，承载 AI 编码规范中的硬性红线
#
# Web 服务扩展域（按需启用）:
#   SEC / REL / OBS
#   → 仅适用于有网络暴露的 Web 服务项目
#   → 纯 CLI 工具、离线脚本、库项目可删除这三个域的所有约束
#   → 所有扩展域约束默认设为 SHOULD（不阻断），上线前改为 MUST

# ── 域定义 ──
domains:
  # === 核心六域（所有项目必须）===
  STRUCT: "结构约束 — 文件、模块、接口必须存在且形态正确"
  DATA: "数据约束 — 关键数据表示、类型白名单、字段合法性"
  BEHAVE: "行为约束 — 核心逻辑必须满足的运行时行为"
  QUAL: "质量约束 — 测试、覆盖率、性能阈值"
  PROC: "过程约束 — 开发过程中必须遵守的纪律"
  STYLE: "编码规范 — 硬性红线、分层约束、自检清单（注入 AI 上下文）"

  # === Web 服务扩展���（仅 Web 项目启用，CLI/Lib 项目可删除）===
  SEC: "安全约束 — 代码安全扫描、敏感信息检测、权限验证 [Web项目]"
  REL: "可靠性约束 — 重试/熔断/超时/健康检查 [Web项目]"
  OBS: "可观测性约束 — 日志、指标、追踪 [Web项目]"

# ── 业务域 → 治理域映射（可选，v1.10.1+）──
# 当意图图谱使用业务域（如 BRAND/MEMBER/COURSE）而约束矩阵使用
# 治理域（STRUCT/DATA/...）时，在此声明两者的交叉覆盖关系，
# 供 verify_triangulation.py 做三方一致性验证。
# 若图谱域与约束域本就是同一套分类，可删除本段（退回模糊匹配）。
#
# domain_mapping:
#   BRAND: [STRUCT, BEHAVE, STYLE]
#   MEMBER: [DATA, BEHAVE, SEC]
#   "*": [PROC, REL, OBS]    # "*" = 全局治理域（不隶属特定业务域）

# ── 门禁定义 ──
gates:
  # 核心门禁（所有项目）
  G1: { name: "文件结构完整", domains: [STRUCT] }
  G2: { name: "数据完整性", domains: [DATA] }
  G3: { name: "行为正确", domains: [BEHAVE] }
  G4: { name: "质量达标", domains: [QUAL] }
  G5: { name: "过程合规", domains: [PROC] }
  G0: { name: "编码规范合规 [AI 自检]", domains: [STYLE] }

# ═══════════════════════════════════════════════════════════
# 可移植性注意事项（v1.6 新增——来自真实分发反馈）
# ═══════════════════════════════════════════════════════════
#
# 1. pyyaml 依赖: harness.py 解析 YAML 需要 pyyaml。
#    - 直接运行 harness.py 报 ModuleNotFoundError 时:
#      pip install pyyaml，或通过 collect_telemetry.py 调用（自动创建持久 venv）
#    - HARNESS_PY 环境变量可指向已装 pyyaml 的 python
#
# 2. npx 类 check 会超时: 若约束 check 字段使用 `npx <tool>`，
#    首次执行会现场下载包导致超时（默认 30s）。
#    解决: 把工具预装到 devDependencies（npm i -D），check 改为直接调用。
#    示例: npx secretlint → node_modules/.bin/secretlint
#
# 3. git 类 check 需仓库已 init: `git check-ignore` 等命令在非 git 项目中失败。
#    解决: 约束 check 前加 `git rev-parse --git-dir &&` 前置判定，
#    或在 auto_recover 中执行 `git init`。
#
# 4. 覆盖率读取: harness 的 _parse_coverage 读取 coverage/coverage-summary.json。
#    vitest 需在 vitest.config.ts 中配置 json-summary reporter:
#      coverage: { reporter: ['text', 'json-summary'] }
#    jest 需加 --coverage --json 参数。
#    未配置时 coverage 显示 0.0，C-QUAL-01 会误判为失败。

# 约束清单
constraints:
  # ===== STYLE: 编码规范（AI 自检域）=====
  # STYLE 域约束来自 Template_AI_Coding_Guide.md 的硬性红线。
  # 每条约束的 check 字段引用 AI_Coding_Guide 中的自检清单条目。
  # OA 在项目初始化时从 AI_Coding_Guide.md 同步。
  - id: C-STYLE-01
    domain: STYLE
    level: MUST
    description: "AI 编码规范文件存在且非空"
    check: "test -f governance/AI_Coding_Guide.md && test -s governance/AI_Coding_Guide.md"
    watch_paths: ["governance/AI_Coding_Guide.md"]
    gate: G0
    on_failure: "block"
    owner: "OA"
    evidence: "文件存在性检查输出 + AI_Coding_Guide.md 内容快照"
    auto_recover:
      command: "cp templates/Template_AI_Coding_Guide.md governance/AI_Coding_Guide.md"
      description: "从模板���建 AI_Coding_Guide.md"

  - id: C-STYLE-02
    domain: STYLE
    level: SHOULD
    description: "硬性红线不超过 5 条（过多会导致 AI 选择性忽略）"
    check: "true"
    watch_paths: ["governance/AI_Coding_Guide.md"]
    gate: G0
    on_failure: "warn"
    owner: "IO"
    evidence: "红线计数结果 + AI_Coding_Guide.md 评审记录"
    manual: true

  - id: C-STYLE-03
    domain: STYLE
    level: SHOULD
    description: "至少 1 条硬性红线已从 [待 OA 填写] 改为实际规则"
    check: "grep -q '| [0-9] | [^[]' governance/AI_Coding_Guide.md"
    watch_paths: ["governance/AI_Coding_Guide.md"]
    gate: G0
    on_failure: "warn"
    owner: "OA"
    evidence: "grep 匹配输出"
    domain: STYLE
    level: SHOULD
    description: "每条红线包含原因说明（帮助 AI 举一反三）"
    check: "grep -q '原因' governance/AI_Coding_Guide.md"
    watch_paths: ["governance/AI_Coding_Guide.md"]
    gate: G0
    on_failure: "warn"
    owner: "OA"
    evidence: "grep 匹配输出"
    manual: true

  # ===== STRUCT =====
  - id: C-STRUCT-01
    domain: STRUCT
    level: MUST
    description: "治理文档目录 governance/ 存在"
    check: "test -d governance/"
    watch_paths: ["governance/"]
    gate: G1
    on_failure: "block"
    owner: "OA"
    evidence: "test -d 退出码 + 目录列表"
    auto_recover:
      command: "mkdir -p governance/"
      description: "自动创建 governance/ 目录"

  - id: C-STRUCT-02
    domain: STRUCT
    level: MUST
    description: "意图图谱和约束矩阵文件存在"
    check: "test -f governance/Intent_Graph.md && test -f governance/constraints.yaml"
    watch_paths: ["governance/Intent_Graph.md", "governance/constraints.yaml"]
    gate: G1
    on_failure: "block"
    owner: "OA"
    evidence: "文件存在性检查输出"

  - id: C-STRUCT-03
    domain: STRUCT
    level: SHOULD
    description: "项目源码目录 src/ 和测试目录 tests/ 存在 [CLI/Lib 项目可按需调整路径]"
    check: "test -d src/ && test -d tests/"
    watch_paths: ["src/", "tests/"]
    gate: G1
    on_failure: "warn"
    owner: "OA"
    evidence: "目录列表"

  # ===== DATA =====
  - id: C-DATA-01
    domain: DATA
    level: MUST
    description: "意图图谱中包含项目名称"
    check: "grep -q 'YOUR_PROJECT_NAME' governance/Intent_Graph.md"
    watch_paths: ["governance/Intent_Graph.md"]
    gate: G2
    on_failure: "block"
    owner: "IO"
    evidence: "grep 输出"

  - id: C-DATA-02
    domain: DATA
    level: MUST
    description: "约束矩阵中包含至少一条 MUST 约束"
    check: "test $(grep -c 'MUST' governance/constraints.yaml 2>/dev/null || echo 0) -gt 0"
    watch_paths: ["governance/constraints.yaml"]
    gate: G2
    on_failure: "block"
    owner: "OA"
    evidence: "MUST 计数结果"

  # ===== BEHAVE =====
  - id: C-BEHAVE-01
    domain: BEHAVE
    level: SHOULD
    description: "核心脚本可被 Python 解析 [按项目语言调整]"
    check: "python3 -c 'import ast; ast.parse(open(\"scripts/collect_telemetry.py\").read())'"
    watch_paths: ["scripts/collect_telemetry.py"]
    gate: G3
    on_failure: "warn"
    owner: "OA"
    evidence: "AST 解析退出码"

  # ===== QUAL =====
  - id: C-QUAL-01
    domain: QUAL
    level: MUST
    description: "测试覆盖率 ≥ 阈值（默认 80%）[无测试项目可设例外]"
    # 注意: 此 check 默认按 Python 项目写。按语言改写 check：
    #   Python:  python3 -m pytest --cov=src --cov-report=term --cov-fail-under=80 tests/
    #   Node/vitest (v2+):  check: "npx vitest run --coverage"
    #     —— 覆盖率阈值与 json-summary 写在 vitest.config 的 test.coverage 里
    #        （reporter: ['text','json-summary']，且 thresholds.lines≥80）。
    #     —— ⚠️ vitest v2 不支持连字符写法 `--coverage-reporter=json-summary`，
    #        必须用点号 `--coverage.reporter=json-summary` 或直接写进配置，
    #        否则命令报错 → 门禁 C-QUAL-01 误判失败。
    #   harness 的 _parse_coverage 只读 coverage/coverage-summary.json
    check: "python3 -m pytest --cov=src --cov-report=term --cov-fail-under=80 tests/"
    watch_paths: ["src/", "tests/"]
    gate: G4
    on_failure: "block"
    owner: "Tech Lead"
    evidence: "pytest --cov 覆盖率报告"

  # ===== PROC =====
  - id: C-PROC-01
    domain: PROC
    level: MUST
    description: "契约签署前不得创建业务代码"
    check: "true"
    watch_paths: ["src/"]
    gate: G5
    on_failure: "block"
    owner: "IO"
    evidence: "git log 时间戳比对记录"
    manual: true

  - id: C-PROC-02
    domain: PROC
    level: MUST
    description: "任一 MUST 失败时，禁止标记完成"
    check: "true"
    gate: G5
    on_failure: "block"
    owner: "OA"
    evidence: "门禁检查结果汇总"
    manual: true

  - id: C-PROC-03
    domain: PROC
    level: SHOULD
    description: "约束失败原因不明确或影响范围未知时，提交 IO/OA 裁决"
    check: "true"
    gate: G5
    on_failure: "escalate"
    owner: "IO"
    evidence: "裁决记录（含失败约束 ID + 上下文 + IO 决定）"
    manual: true

  # ═══════════════════════════════════════════════════════════
  # Web 服务扩展约束（CLI / Lib 项目可整段删除）
  # ═══════════════════════════════════════════════════════════

  # ===== SEC: 安全约束 [仅 Web 项目] =====
  - id: C-SEC-01
    domain: SEC
    level: SHOULD
    description: "Python 代码无高危安全问题 [仅 Web 项目]"
    check: "nfr:bandit"
    nfr_params:
      target: "src/"
      severity: "medium"
    watch_paths: ["src/"]
    gate: G6
    on_failure: "warn"
    owner: "Tech Lead"
    evidence: "bandit 扫描报告 JSON"

  - id: C-SEC-02
    domain: SEC
    level: MUST
    description: "源代码中无硬编码密钥/令牌"
    check: "nfr:secrets"
    nfr_params:
      scan_dirs: ["src", "scripts"]
      exclude_dirs: [".git", "__pycache__", "node_modules", "venv"]
    watch_paths: ["src/", "scripts/"]
    gate: G6
    on_failure: "block"
    owner: "Tech Lead"
    evidence: "secrets 扫描报告"

  # ===== REL: 可靠性约束 [仅 Web 项目] =====
  - id: C-REL-01
    domain: REL
    level: SHOULD
    description: "API 包含健康检查端点 [仅 Web 项目]"
    check: "nfr:health_endpoint"
    nfr_params:
      scan_dirs: ["src/api", "src/routes", "src/app"]
    watch_paths: ["src/api/", "src/routes/"]
    gate: G7
    on_failure: "warn"
    owner: "Tech Lead"
    evidence: "健康检查端点扫描结果"

  - id: C-REL-02
    domain: REL
    level: SHOULD
    description: "外部调用包含重试/熔断/超时机制 [仅 Web 项目]"
    check: "nfr:retry_pattern"
    nfr_params:
      scan_dirs: ["src"]
    watch_paths: ["src/"]
    gate: G7
    on_failure: "warn"
    owner: "Tech Lead"
    evidence: "retry 模式扫描结果"

  # ===== OBS: 可观测性约束 [仅 Web 项目] =====
  - id: C-OBS-01
    domain: OBS
    level: SHOULD
    description: "使用结构化日志 [仅 Web 项目]"
    check: "nfr:log_structured"
    nfr_params:
      scan_dirs: ["src"]
    watch_paths: ["src/"]
    gate: G8
    on_failure: "warn"
    owner: "Tech Lead"
    evidence: "日志结构扫描结果"

  - id: C-OBS-02
    domain: OBS
    level: SHOULD
    description: "暴露 /metrics 指标端点 [仅 Web 项目]"
    check: "nfr:monitoring_endpoint"
    nfr_params:
      scan_dirs: ["src"]
    watch_paths: ["src/"]
    gate: G8
    on_failure: "warn"
    owner: "Tech Lead"
    evidence: "监控端点扫描结果"

# ─── 降级与恢复策略（全局配置）────────────────────────────

# 约束失败时的默认行为（可被单条约束覆盖）
# 四级策略: warn / block / escalate / log
default_failure_policy:
  MUST: "block"       # MUST 失败 → 阻止继续
  SHOULD: "warn"      # SHOULD 失败 → 警告但允许继续
  MAY: "log"          # MAY 失败 → 仅记录
  # escalate: 系统无法自行决定时使用，不绑定 level，按需在单条约束上设置
  # 典型场景: 人工判断类约束、规则歧义、影响范围不明的失败

# 自动恢复策略（harness.py recover 子命令执行）
auto_recovery:
  enabled: true
  max_retries: 3
  retry_delay_seconds: 5

# 约束冲突优先级链（数字越大优先级越高）
constraint_priority:
  SEC: 100    # 安全约束最高优先
  DATA: 90    # 数据完整性
  STRUCT: 80  # 结构约束
  STYLE: 75   # 编码规范（AI 自检）
  BEHAVE: 70  # 行为约束
  PROC: 60    # 过程约束
  QUAL: 50    # 质量约束
  REL: 40     # 可靠性
  OBS: 30     # 可观测性

# 例外记录
exceptions: []
# 示例:
# - id: EX-001
#   constraint_id: C-SEC-01
#   reason: "MVP 阶段暂不执行完整安全扫描"
#   approved_by: "IO"
#   valid_until: "2025-08-21"

# ═══════════════════════════════════════════════════════════
# 多模块场景: 模块级约束
# ═══════════════════════════════════════════════════════════
#
# 当项目包含多个模块（如电商: user/product/order/payment/logistics），
# 每个模块可在 modules/<module_id>/constraints.yaml 中定义模块特有约束。
#
# 模块级约束叠加到全局约束之上:
#   harness.py check --all --module payment
#   → 加载 governance/constraints.yaml + modules/payment/constraints.yaml
#
# 模块级约束的 ID 自动加前缀 M-<module>- 以避免冲突。
# 模块 OA 创建模块级约束时只需定义本模块特有的规则。
# 全局约束中的规则无需在模块级重复。
