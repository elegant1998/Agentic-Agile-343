# Loop Memory — 跨 cycle 状态文件
# 版本: 1.0
# 定位: Lance Martin "Memory Write" 零件的统一载体。
#       每个 SCOPE-V cycle 结束后由 reflect.py --carry-over 写入，
#       下一个 cycle 的 crop_context.py Rules Load 阶段自动加载。
#
# 设计原则:
#   - 一个文件串起所有 cycle，而非每个 cycle 独立文件
#   - 只保留"对下一个 cycle 有用的信息"，自动淘汰过期条目
#   - 可被人类 OA 直接阅读和编辑

project: YOUR_PROJECT_NAME
last_updated: ""

# ── 进度追踪 ──
progress:
  completed_nodes: []       # 已完成的 DAG 节点 ID
  current_node: null         # 当前正在执行的节点
  cycles_completed: 0        # 已完成的 SCOPE-V 周期数
  last_cycle_at: ""          # 上次 cycle 完成时间

# ── 跨任务传递（carry-over）──
# 每个 cycle 结束时 reflect.py 自动追加
carry_over:
  # 示例:
  # - from_cycle: 3
  #   task: T-003
  #   date: "2025-07-21"
  #   lessons:
  #     - "使用 crop_context.py 裁剪后给 AS，避免全局上下文泄漏"
  #   risks:
  #     - "prompt 过长导致 AS 忽略部���约束"
  #   patterns:
  #     - "router/schemas/service 三层架构"
  #   open_issues:
  #     - "T-004 需要确认支付接口签名"

# ── 记忆衰减 ──
# 超过 decay_days 的条目自动标记为 ~strikethrough~
decay_config:
  enabled: true
  max_age_days: 90           # 超过此天数的教训自动衰减

# ── 决策日志 ──
# 记录关键决策及其原因，供后续 cycle 参考
decisions: []
# 示例:
# - cycle: 2
#   decision: "选择 PostgreSQL 而非 MySQL"
#   reason: "JSONB 类型更适合灵活属性的存储"
#   made_by: "OA"
#   date: "2025-07-21"
